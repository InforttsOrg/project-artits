  <circle cx="255.0" cy="255.5" r="177" fill="none" stroke="url(#ring-grad)" stroke-width="1.0" stroke-dasharray="150 15 50 10" opacity="0.6" filter="url(#sonar-glow)" />
  <circle cx="256.5" cy="256.5" r="183" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="80 40 120 30" opacity="0.5" filter="url(#sonar-glow)" />
  <circle cx="256.0" cy="257.0" r="186" fill="none" stroke="url(#ring-grad)" stroke-width="0.75" stroke-dasharray="10 5 20 8" opacity="0.35" filter="url(#sonar-glow)" />
  <circle cx="255.5" cy="255.0" r="174" fill="none" stroke="url(#ring-grad)" stroke-width="1.25" stroke-dasharray="40 10 60 15" opacity="0.4" filter="url(#sonar-glow)" />

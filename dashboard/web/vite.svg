<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Intense Sonar Glow Filter -->
    <filter id="sonar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Subtle Inner Glow -->
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Background Space Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="60%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    <!-- Backlit Sonar Crescent Gradient -->
    <linearGradient id="ring-grad" x1="0.8" y1="0.1" x2="0.2" y2="0.9">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.0" />
    </linearGradient>
    <!-- Planet Silhouette Depth Gradient -->
    <radialGradient id="planet-grad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="85%" stop-color="#03050a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <!-- Deep Space Canvas -->
  <rect width="512" height="512" fill="url(#bg-grad)" />
  <!-- Sonar Star Fields (Point Echoes) -->
  <circle cx="120" cy="150" r="1.5" fill="#38bdf8" opacity="0.4" />

name: Project Deployment (Artits)

on:
  push:
    branches:
      - main

jobs:
  deploy-portfolio:
    name: Deploy Story Portfolio to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Artits
        uses: actions/checkout@v4
        with:
          path: artits

      - name: Manual Clone Shared Brain
        env:
          SHARED_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        if: env.SHARED_TOKEN != ''
        run: |
          git clone https://${{ secrets.GH_PAT_TOKEN }}@github.com/InforttsOrg/shared.git shared
          cd shared && git checkout main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Deploy Portfolio
        run: |
          cd artits
          npm install
          npm run build

      - name: Create Cloudflare Pages Project
        run: npx wrangler pages project create project-app-artits --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: project-app-artits
          directory: artits/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
